<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Le Labyrinthe des Hassanats — IAKAI</title>
  <meta name="description" content="Le Labyrinthe des Hassanats : traverse le labyrinthe, collecte les bonnes actions et évite les péchés. Un jeu à la Pac-Man pour toute la famille.">
  <link rel="canonical" href="https://iakai.fr/jeux/labyrinthe-hassanats/">
  <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IAKAI">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Le Labyrinthe des Hassanats — IAKAI">
  <meta property="og:description" content="Le Labyrinthe des Hassanats : traverse le labyrinthe, collecte les bonnes actions et évite les péchés. Un jeu à la Pac-Man pour toute la famille.">
  <meta property="og:url" content="https://iakai.fr/jeux/labyrinthe-hassanats/">
  <meta property="og:image" content="https://iakai.fr/logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .iakai-back-link {
      position: fixed;
      top: 10px;
      left: 14px;
      z-index: 9999;
      font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
      font-size: 14px;
      color: #1a4d8f;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.25s ease;
      padding: 2px 6px;
    }
    .iakai-back-link:hover { opacity: 1; }
    @media (max-width: 600px) {
      .iakai-back-link { opacity: 0.5; font-size: 12px; top: 6px; left: 8px; }
    }
  </style>
</head>
<body>
  <a href="../../index.html" class="iakai-back-link">← retour à iakai.fr</a>
  <div id="game"></div>

  <!-- ================================================================
       DÉFINITIONS SVG GLOBALES
       Filters + 4 sprites validés (extraits de sprites-preview.html, non modifiés)
       + filter de purification (feColorMatrix) + gradient halo de l'ange
       ================================================================ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Filter "trait dessiné à la main" (murs et éléments hand-drawn) -->
      <filter id="hand-drawn" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4"/>
      </filter>

      <!-- Filters internes des 4 sprites -->
      <filter id="hd-girl" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4"/>
        <feDisplacementMap in="SourceGraphic" scale="1.4"/>
      </filter>
      <filter id="hd-boy" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="1.4"/>
      </filter>
      <filter id="hd-demon" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
        <feDisplacementMap in="SourceGraphic" scale="1.6"/>
      </filter>
      <filter id="hd-light" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2"/>
        <feDisplacementMap in="SourceGraphic" scale="1.2"/>
      </filter>

      <!-- Filter de purification : désature les démons et les recolore en doré pâle -->
      <filter id="purify-filter" x="-10%" y="-10%" width="120%" height="120%">
        <feColorMatrix type="matrix" values="
          0.45 0.45 0.45 0  0.30
          0.40 0.40 0.40 0  0.20
          0.10 0.10 0.10 0  0.05
          0    0    0    1  0"/>
      </filter>

      <!-- Gradients du sprite "good-light" -->
      <radialGradient id="halo-grad" cx="50%" cy="45%" r="55%">
        <stop offset="0%"   stop-color="#fdfdf8" stop-opacity="0.95"/>
        <stop offset="40%"  stop-color="#f5e6a8" stop-opacity="0.7"/>
        <stop offset="80%"  stop-color="#e8b837" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#e8b837" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="body-grad" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%"   stop-color="#fdfdf8"/>
        <stop offset="100%" stop-color="#f5e6a8"/>
      </linearGradient>

      <!-- Gradient du halo extérieur des anges (dans le labyrinthe) -->
      <radialGradient id="angel-glow-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#fdfdf8" stop-opacity="0.85"/>
        <stop offset="40%"  stop-color="#e8b837" stop-opacity="0.55"/>
        <stop offset="80%"  stop-color="#e8b837" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#e8b837" stop-opacity="0"/>
      </radialGradient>

      <!-- Gradient halo joueur (Protection totale) -->
      <radialGradient id="player-halo-grad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#fdfdf8" stop-opacity="0.7"/>
        <stop offset="55%"  stop-color="#e8b837" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#e8b837" stop-opacity="0"/>
      </radialGradient>

      <!-- ============ Sprite 1 : Joueuse ============ -->
      <symbol id="player-girl" viewBox="0 0 100 100">
        <g fill="none" stroke="#1a4d8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#hd-girl)">
          <circle cx="50" cy="22" r="11"/>
          <path d="M 39 18 Q 32 22, 33 32 Q 37 30, 39 25" fill="#1a4d8f"/>
          <path d="M 61 18 Q 68 22, 67 32 Q 63 30, 61 25" fill="#1a4d8f"/>
          <path d="M 42 16 Q 50 13, 58 16" stroke-width="2"/>
          <circle cx="46" cy="22" r="0.9" fill="#1a4d8f" stroke="none"/>
          <circle cx="54" cy="22" r="0.9" fill="#1a4d8f" stroke="none"/>
          <path d="M 46 27 Q 50 29, 54 27" stroke-width="1.6"/>
          <line x1="50" y1="33" x2="50" y2="38"/>
          <path d="M 50 38 L 32 76 L 68 76 Z" fill="#e8d4f0"/>
          <line x1="40" y1="58" x2="60" y2="58" stroke-width="1.6"/>
          <line x1="44" y1="42" x2="30" y2="56"/>
          <line x1="56" y1="42" x2="70" y2="56"/>
          <circle cx="29" cy="57" r="2" fill="#1a4d8f" stroke="none"/>
          <circle cx="71" cy="57" r="2" fill="#1a4d8f" stroke="none"/>
          <line x1="44" y1="76" x2="42" y2="92"/>
          <line x1="56" y1="76" x2="58" y2="92"/>
          <line x1="38" y1="92" x2="44" y2="92" stroke-width="3"/>
          <line x1="56" y1="92" x2="62" y2="92" stroke-width="3"/>
        </g>
      </symbol>

      <!-- ============ Sprite 2 : Joueur ============ -->
      <symbol id="player-boy" viewBox="0 0 100 100">
        <g fill="none" stroke="#1a4d8f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#hd-boy)">
          <circle cx="50" cy="22" r="11"/>
          <path d="M 40 17 Q 42 11, 50 11 Q 58 11, 60 17 Q 56 14, 50 14 Q 44 14, 40 17 Z" fill="#1a4d8f"/>
          <path d="M 47 14 L 51 18" stroke-width="2"/>
          <circle cx="46" cy="23" r="0.9" fill="#1a4d8f" stroke="none"/>
          <circle cx="54" cy="23" r="0.9" fill="#1a4d8f" stroke="none"/>
          <path d="M 46 28 Q 50 30, 54 28" stroke-width="1.6"/>
          <line x1="50" y1="33" x2="50" y2="38"/>
          <path d="M 38 38 L 34 70 L 66 70 L 62 38 Z" fill="#c8e0f0"/>
          <path d="M 46 38 L 50 42 L 54 38" stroke-width="1.6"/>
          <line x1="40" y1="42" x2="28" y2="58"/>
          <line x1="60" y1="42" x2="72" y2="58"/>
          <circle cx="27" cy="59" r="2" fill="#1a4d8f" stroke="none"/>
          <circle cx="73" cy="59" r="2" fill="#1a4d8f" stroke="none"/>
          <line x1="42" y1="70" x2="40" y2="92"/>
          <line x1="58" y1="70" x2="60" y2="92"/>
          <line x1="36" y1="92" x2="44" y2="92" stroke-width="3"/>
          <line x1="56" y1="92" x2="64" y2="92" stroke-width="3"/>
        </g>
      </symbol>

      <!-- ============ Sprite 3 : Démon (péché) ============ -->
      <symbol id="sin-demon" viewBox="0 0 100 100">
        <g filter="url(#hd-demon)">
          <ellipse cx="50" cy="58" rx="22" ry="24" fill="#d63838" stroke="#8a1f1f" stroke-width="2.2"/>
          <circle cx="50" cy="38" r="18" fill="#d63838" stroke="#8a1f1f" stroke-width="2.2"/>
          <path d="M 38 24 L 34 10 L 44 22 Z" fill="#8a1f1f" stroke="#5a1010" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M 62 24 L 66 10 L 56 22 Z" fill="#8a1f1f" stroke="#5a1010" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M 40 32 L 47 35" stroke="#5a1010" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <path d="M 60 32 L 53 35" stroke="#5a1010" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <circle cx="44" cy="40" r="2.4" fill="#fdfdf6"/>
          <circle cx="56" cy="40" r="2.4" fill="#fdfdf6"/>
          <circle cx="44" cy="40.5" r="1.2" fill="#1a1a1a"/>
          <circle cx="56" cy="40.5" r="1.2" fill="#1a1a1a"/>
          <path d="M 45 47 Q 50 45, 55 47" stroke="#5a1010" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M 28 56 Q 22 60, 24 66" stroke="#8a1f1f" stroke-width="2.2" fill="#d63838" stroke-linecap="round"/>
          <path d="M 72 56 Q 78 60, 76 66" stroke="#8a1f1f" stroke-width="2.2" fill="#d63838" stroke-linecap="round"/>
          <ellipse cx="42" cy="82" rx="5" ry="3" fill="#8a1f1f"/>
          <ellipse cx="58" cy="82" rx="5" ry="3" fill="#8a1f1f"/>
          <path d="M 70 76 Q 80 78, 84 84" stroke="#8a1f1f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path d="M 82 82 L 88 82 L 84 87 Z" fill="#8a1f1f"/>
        </g>
      </symbol>

      <!-- ============ Sprite 4 : Être de lumière (ange) ============ -->
      <symbol id="good-light" viewBox="0 0 100 100">
        <circle cx="50" cy="45" r="42" fill="url(#halo-grad)"/>
        <g filter="url(#hd-light)">
          <path d="M 30 42 Q 12 38, 8 52 Q 12 60, 22 60 Q 28 56, 32 50 Z"
                fill="#fdfdf8" stroke="#e8b837" stroke-width="2" stroke-linejoin="round"/>
          <path d="M 16 48 Q 20 50, 24 52" stroke="#e8b837" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M 14 53 Q 18 55, 22 56" stroke="#e8b837" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M 70 42 Q 88 38, 92 52 Q 88 60, 78 60 Q 72 56, 68 50 Z"
                fill="#fdfdf8" stroke="#e8b837" stroke-width="2" stroke-linejoin="round"/>
          <path d="M 84 48 Q 80 50, 76 52" stroke="#e8b837" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M 86 53 Q 82 55, 78 56" stroke="#e8b837" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M 50 18 Q 42 28, 42 42 Q 42 58, 46 70 Q 48 78, 50 82 Q 52 78, 54 70 Q 58 58, 58 42 Q 58 28, 50 18 Z"
                fill="url(#body-grad)" stroke="#e8b837" stroke-width="2" stroke-linejoin="round"/>
          <line x1="50" y1="26" x2="50" y2="74" stroke="#e8b837" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
          <circle cx="50" cy="14" r="2.5" fill="#fdfdf8" stroke="#e8b837" stroke-width="1.2"/>
          <path d="M 50 9 L 50 19 M 45 14 L 55 14" stroke="#e8b837" stroke-width="0.8" stroke-linecap="round"/>
        </g>
      </symbol>

      <!-- Petite icône de portail pour le tutoriel -->
      <symbol id="door-icon" viewBox="0 0 32 32">
        <path d="M 8 28 L 8 14 Q 8 6, 16 6 Q 24 6, 24 14 L 24 28 Z"
              fill="none" stroke="#1a4d8f" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="20" cy="18" r="1.4" fill="#e8b837"/>
      </symbol>
    </defs>
  </svg>

  <script src="game.js"></script>
</body>
</html>
